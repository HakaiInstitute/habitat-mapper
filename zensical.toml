[project]
site_name = "Habitat-Mapper"
site_url = "https://habitat-mapper.readthedocs.io/"
repo_url = "https://github.com/HakaiInstitute/habitat-mapper"
repo_name = "HakaiInstitute/habitat-mapper"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Get Started" = [
    "get-started/index.md",
    { "1. Using the Terminal" = "get-started/terminal.md" },
    { "2. Install" = "get-started/install.md" },
    { "3. Your First Segmentation" = "get-started/first-segmentation.md" },
    { "4. View Results in GIS" = "get-started/view-results.md" },
  ] },
  { "Guides" = [
    { "Prepare Your Imagery" = "guides/prepare-imagery.md" },
    { "Tune Processing" = "guides/tune-processing.md" },
    { "Process Many Images" = "guides/batch-processing.md" },
    { "Post-Process Drone Kelp" = "guides/post-process-kelp-drone.md" },
    { "Satellite Kelp with SKeMa" = [
      { "Download Sentinel-2 Data" = "guides/skema/download.md" },
      { "Run SKeMa" = "guides/skema/run.md" },
      { "Post-Process" = "guides/skema/post-process.md" },
    ] },
    { "Use from Python" = "guides/python.md" },
    { "Install for Python Users" = "guides/install-advanced.md" },
    { "Upgrade to 0.17" = "guides/upgrade-to-0-17.md" },
    { "Upgrade from Kelp-O-Matic" = "guides/upgrade-from-kom.md" },
  ] },
  { "Models" = [
    "models/index.md",
    { "Kelp: Drone" = "models/kelp-drone.md" },
    { "Kelp: Satellite" = "models/kelp-satellite.md" },
    { "Mussels & Barnacles" = "models/intertidal.md" },
    { "Eelgrass" = "models/eelgrass.md" },
    { "How the Models Work" = "models/how-it-works.md" },
    { "Performance Metrics" = "models/metrics.md" },
  ] },
  { "Reference" = [
    { "CLI" = "reference/cli.md" },
    { "Python API" = "reference/python-api.md" },
    { "Cheat Sheet" = "reference/cheat-sheet.md" },
    { "Glossary" = "reference/glossary.md" },
  ] },
  { "Help" = [
    { "Troubleshooting & FAQ" = "help/faq.md" },
    { "Report an Issue" = "https://github.com/HakaiInstitute/habitat-mapper/issues" },
  ] },
  { "Cite & Credits" = [
    { "How to Cite" = "cite.md" },
    { "Credits" = "credits.md" },
    { "License" = "https://github.com/HakaiInstitute/habitat-mapper/blob/main/LICENSE" },
  ] },
]

extra_css = ["stylesheets/extra.css"]
extra_javascript = [
  "javascripts/header-link.js",
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

[project.theme]
language = "en"
features = [
  "navigation.indexes",
  "navigation.instant",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.top",
  "navigation.footer",
  "navigation.instant.prefetch",
  "content.tabs.link",
  "content.code.copy",
]

[project.theme.palette]
primary = "teal"

[project.theme.icon]
logo = "material/shore"

[project.extra.analytics]
provider = "google"
property = "G-RSSQERRJ3Q"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://ca.linkedin.com/company/hakai-institute"

[[project.extra.social]]
icon = "fontawesome/brands/instagram"
link = "https://www.instagram.com/hakaiinstitute"

[project.extra.consent]
title = "Cookie consent"
description = """
  We use cookies to recognize your repeated visits and preferences, as well
  as to measure the effectiveness of our documentation and whether users
  find what they're searching for. With your consent, you're helping us to
  make our documentation better.
"""

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
md_in_html = {}
def_list = {}
footnotes = {}
tables = {}
toc.toc_depth = 3
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.keys = {}
pymdownx.tilde = {}
pymdownx.arithmatex.generic = true
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.slugify.object = "pymdownx.slugs.slugify"
pymdownx.tabbed.slugify.kwds.case = "lower"
pymdownx.tasklist.custom_checkbox = true
pymdownx.snippets.base_path = ["includes"]
pymdownx.snippets.auto_append = ["abbreviations.md"]
pymdownx.snippets.check_paths = true

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_root_heading = true
heading_level = 3
members_order = "source"
merge_init_into_class = true
separate_signature = true
show_signature_annotations = true
filters = ["!^_"]

[project.plugins.redirects.redirect_maps]
"beginner_guide/index.md" = "get-started/index.md"
"beginner_guide/terminal_crash_course.md" = "get-started/terminal.md"
"installation.md" = "get-started/install.md"
"beginner_guide/execution.md" = "get-started/first-segmentation.md"
"beginner_guide/post_processing.md" = "guides/post-process-kelp-drone.md"
"tutorials/skema/downloading_data.md" = "guides/skema/download.md"
"tutorials/skema/model_variants.md" = "guides/skema/run.md"
"guides/skema/variants.md" = "guides/skema/run.md"
"tutorials/skema/post_processing.md" = "guides/skema/post-process.md"
"quick_reference.md" = "reference/cheat-sheet.md"
"expectations.md" = "guides/prepare-imagery.md"
"cli.md" = "reference/cli.md"
"python_lib.md" = "guides/python.md"
"model_outputs.md" = "models/index.md"
"training_details.md" = "models/how-it-works.md"
"model_performance.md" = "models/index.md"
"faqs.md" = "help/faq.md"
"glossary.md" = "reference/glossary.md"
"attribution.md" = "credits.md"
