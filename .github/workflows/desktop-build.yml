name: 🖥️ Desktop Build

on:
  pull_request:
    branches:
      - '**'
    paths:
      - 'src/**'
      - 'packaging/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/desktop-build.yml'
  # Same release tags as pypi-publish.yml, minus .dev and .post
  push:
    branches-ignore:
      - '**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+a[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+b[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+rc[0-9]+'
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read  # The SignPath action reads the job and downloads the artifacts it signs
    env:
      # Windows builds are signed through SignPath on release tags and manual runs. Pull requests skip signing because
      # they can't read the SignPath token. Release tags use the release-signing policy, which a maintainer approves in
      # SignPath. Manual runs use test-signing, which needs no approval but makes signatures Windows doesn't trust.
      SIGN: ${{ matrix.os == 'windows-latest' && github.event_name != 'pull_request' }}
      SIGNING_POLICY: ${{ github.ref_type == 'tag' && 'release-signing' || 'test-signing' }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.13.6"
          enable-cache: false

      - name: "Set up Python"
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"

      - name: Set the version from the release tag
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]] || { echo "Unexpected tag $TAG"; exit 1; }
          uv version --frozen "${TAG#v}"

      - name: Install dependencies
        run: uv sync --frozen --no-dev --group freeze --extra gui

      # Frozen builds only use WebGPU and the CPU, so the CPU package replaces onnxruntime-gpu
      - name: Use the CPU ONNX Runtime package
        if: runner.os != 'macOS'
        shell: bash
        run: |
          ORT_VERSION=$(uv run --no-sync python -c "from importlib.metadata import version; print(version('onnxruntime-gpu'))")
          uv pip uninstall onnxruntime-gpu
          uv pip install "onnxruntime==$ORT_VERSION"

      - name: Freeze
        run: uv run --no-sync pyinstaller packaging/habitat-mapper.spec --noconfirm

      # Downloads a ~100 MB model, so a stalled download fails here rather than at the 6 hour job limit
      - name: Smoke test
        timeout-minutes: 15
        run: uv run --no-sync python packaging/smoke_test.py dist/habitat-mapper/hab dist/habitat-mapper/Habitat-Mapper

      # The executables are signed before the installer is built so the installer packs the signed copies
      - name: Upload the executables for signing
        id: upload-unsigned-executables
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: unsigned-executables
          path: |
            dist/habitat-mapper/hab.exe
            dist/habitat-mapper/Habitat-Mapper.exe
          retention-days: 1
          if-no-files-found: error

      - name: Sign the executables
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b  # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: habitat-mapper
          signing-policy-slug: ${{ env.SIGNING_POLICY }}
          artifact-configuration-slug: executables
          github-artifact-id: ${{ steps.upload-unsigned-executables.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600  # Leaves time for a maintainer to approve a release
          output-artifact-directory: signed/executables

      - name: Replace the executables with the signed copies
        if: env.SIGN == 'true'
        shell: bash
        run: cp -f signed/executables/hab.exe signed/executables/Habitat-Mapper.exe dist/habitat-mapper/

      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: bash
        env:
          MSYS_NO_PATHCONV: 1  # Otherwise Git Bash turns the /D option into a file path
        run: |
          VERSION=$(uv run --no-sync python -c "from importlib.metadata import version; print(version('habitat-mapper'))")
          command -v iscc || choco install innosetup --no-progress -y
          iscc "/DAppVersion=$VERSION" packaging/windows/habitat-mapper.iss

      - name: Upload the installer for signing
        id: upload-unsigned-installer
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: unsigned-installer
          path: dist/*.exe
          retention-days: 1
          if-no-files-found: error

      - name: Sign the installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b  # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: habitat-mapper
          signing-policy-slug: ${{ env.SIGNING_POLICY }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed/installer

      - name: Replace the installer with the signed copy
        if: env.SIGN == 'true'
        shell: bash
        run: cp -f signed/installer/*.exe dist/

      # Test signatures don't chain to a trusted root, so only release signatures are checked
      - name: Check the release signatures
        if: env.SIGN == 'true' && github.ref_type == 'tag'
        shell: pwsh
        run: |
          $files = @(Get-Item dist/habitat-mapper/hab.exe, dist/habitat-mapper/Habitat-Mapper.exe, dist/*.exe)
          $bad = $files | Get-AuthenticodeSignature | Where-Object Status -ne 'Valid'
          if ($bad) {
            $bad | Format-Table Path, Status, StatusMessage -AutoSize | Out-String -Width 200 | Write-Host
            exit 1
          }

      - name: Build the macOS disk image
        if: runner.os == 'macOS'
        run: |
          VERSION=$(uv run --no-sync python -c "from importlib.metadata import version; print(version('habitat-mapper'))")
          mkdir dmg
          cp -R dist/Habitat-Mapper.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Habitat-Mapper -srcfolder dmg -ov -format UDZO "dist/Habitat-Mapper-$VERSION-macos-arm64.dmg"

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: installer-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  # Separate job so the build steps never have write access to the repository
  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to upload release assets
    steps:
      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true

      # Reuses a release already made for the tag on GitHub. Alpha, beta and rc tags become pre-releases,
      # which the app's update check ignores.
      - name: Create the release if it doesn't exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && exit 0
          PRERELEASE=()
          [[ "$TAG" =~ (a|b|rc)[0-9]+$ ]] && PRERELEASE=(--prerelease)
          gh release create "$TAG" --verify-tag --generate-notes "${PRERELEASE[@]}" --repo "$GITHUB_REPOSITORY"

      - name: Upload installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
