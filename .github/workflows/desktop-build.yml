name: 🖥️ Desktop Build

on:
  pull_request:
    branches:
      - '**'
    paths:
      - 'src/**'
      - 'packaging/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/desktop-build.yml'
  # Same release tags as pypi-publish.yml, minus .dev and .post
  push:
    branches-ignore:
      - '**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+a[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+b[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+rc[0-9]+'
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.13.6"
          enable-cache: false

      - name: "Set up Python"
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"

      - name: Set the version from the release tag
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]] || { echo "Unexpected tag $TAG"; exit 1; }
          uv version --frozen "${TAG#v}"

      - name: Install dependencies
        run: uv sync --frozen --no-dev --group freeze --extra gui

      # Frozen builds only use WebGPU and the CPU, so the CPU package replaces onnxruntime-gpu
      - name: Use the CPU ONNX Runtime package
        if: runner.os != 'macOS'
        shell: bash
        run: |
          ORT_VERSION=$(uv run --no-sync python -c "from importlib.metadata import version; print(version('onnxruntime-gpu'))")
          uv pip uninstall onnxruntime-gpu
          uv pip install "onnxruntime==$ORT_VERSION"

      - name: Freeze
        run: uv run --no-sync pyinstaller packaging/habitat-mapper.spec --noconfirm

      - name: Smoke test
        run: uv run --no-sync python packaging/smoke_test.py dist/habitat-mapper/hab dist/habitat-mapper/Habitat-Mapper

      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: bash
        env:
          MSYS_NO_PATHCONV: 1  # Otherwise Git Bash turns the /D option into a file path
        run: |
          VERSION=$(uv run --no-sync python -c "from importlib.metadata import version; print(version('habitat-mapper'))")
          command -v iscc || choco install innosetup --no-progress -y
          iscc "/DAppVersion=$VERSION" packaging/windows/habitat-mapper.iss

      - name: Build the macOS disk image
        if: runner.os == 'macOS'
        run: |
          VERSION=$(uv run --no-sync python -c "from importlib.metadata import version; print(version('habitat-mapper'))")
          mkdir dmg
          cp -R dist/Habitat-Mapper.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Habitat-Mapper -srcfolder dmg -ov -format UDZO "dist/Habitat-Mapper-$VERSION-macos-arm64.dmg"

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: installer-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  # Separate job so the build steps never have write access to the repository
  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to upload release assets
    steps:
      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true

      # Reuses a release already made for the tag on GitHub. Alpha, beta and rc tags become pre-releases,
      # which the app's update check ignores.
      - name: Create the release if it doesn't exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && exit 0
          PRERELEASE=()
          [[ "$TAG" =~ (a|b|rc)[0-9]+$ ]] && PRERELEASE=(--prerelease)
          gh release create "$TAG" --verify-tag --generate-notes "${PRERELEASE[@]}" --repo "$GITHUB_REPOSITORY"

      - name: Upload installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
