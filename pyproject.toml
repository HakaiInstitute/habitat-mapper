[project]
name = "habitat-mapper"
version = "0.18.0b3"
description = "Habitat segmentation with AI"
readme = "README.md"
authors = [{ name = "Taylor Denouden", email = "taylor.denouden@hakai.org" }]
requires-python = ">=3.11.5,<3.15"
license = "MIT"
dependencies = [
    "cyclopts>=4.23.0",
    "defusedxml>=0.7.1",
    "humanize>=4.12.3",
    "loguru>=0.7.3",
    "numpy>=2.2.6",
    "onnxruntime>=1.31.1 ; platform_system == 'Darwin'",
    # The plugin is built against a specific ONNX Runtime API, so new releases are only allowed once tested
    "onnxruntime-ep-webgpu>=0.4.0,<0.6",
    "onnxruntime-gpu>=1.31.1 ; platform_system != 'Darwin'",
    "opencv-python-headless>=4.11.0.86",
    "platformdirs>=4.3.8",
    "pydantic>=2.11.7",
    "rasterio>=1.4.4",
    "requests>=2.32.4",
    "rich>=13.0.0",
]

[project.optional-dependencies]
# CUDA 13, for NVIDIA RTX 20 series or newer GPUs with driver R580 or newer. Other GPUs use WebGPU
cuda = [
    "onnxruntime-gpu[cuda, cudnn]>=1.31.1 ; platform_system != 'Darwin'",
]
gui = [
    "packaging>=26.3",
    "pyside6-essentials>=6.12.0",
]

[dependency-groups]
conversion = [
    "notebook>=7.4.5",
    "onnxscript>=0.5.4",
    "segmentation-models-pytorch>=0.5.0",
]
dev = [
    "pyrefly>=0.60.0",
    "ipykernel>=7.1.0",
    "dask[array]>=2026.3.0",
    "mypy>=1.17.1",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pyupgrade>=3.20.0",
    "ruff>=0.17.6",
    "types-requests>=2.32.4.20250809",
    "pytest-cov>=7.1.0",
    "diff-cover>=11.0.4",
    "mutmut>=3.8.1",
    "onnx>=1.23.2",
]
docs = [
    "mkdocstrings-python>=1.19.0",
    "zensical>=0.0.73",
]
examples = [
    "fiona>=1.10.1",
    "jupyter>=1.1.1",
    "polars>=1.33.0",
    "rasterio>=1.4.4",
    "shapely>=2.1.1",
    "tqdm>=4.67.1",
]
freeze = [
    "pyinstaller>=6.22.3",
]

[project.urls]
Documentation = "https://habitat-mapper.readthedocs.io"

[project.scripts]
hab = "habitat_mapper.main:main"

[project.gui-scripts]
hab-gui = "habitat_mapper.gui.app:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
preview = true

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "Q",
    "S",
    "T",
    "UP",
    "ANN",
    "TC",
    "DOC",
    "D",
    "NPY",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",
    "N999",
    "D",
]
"examples/*" = [
    "T201",
    "ANN",
    "D",
    "S101",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
strict = true

# Third-party libraries without stubs
[[tool.mypy.overrides]]
module = [
    "dask.*",
    "onnxruntime.*",
    "onnxruntime_ep_webgpu.*",
    "rasterio.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Keeps pytest out of mutmut's mutants/ copy of the tests
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["habitat_mapper"]
omit = [
    # Qt styling and system tray wiring have no logic worth asserting on
    "*/habitat_mapper/gui/theme.py",
    "*/habitat_mapper/gui/tray.py",
]

[tool.coverage.report]
# A ratchet, not a target: raise this when coverage goes up so it can't quietly fall back
fail_under = 41
skip_covered = true
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.mutmut]
# Modules where a bug silently produces a wrong raster rather than an error. Run with `uv run mutmut run`, then
# `uv run mutmut results` lists the mutants no test noticed
source_paths = ["src/habitat_mapper"]
only_mutate = [
    "src/habitat_mapper/hann.py",
    "src/habitat_mapper/processing.py",
    "src/habitat_mapper/utils.py",
    "src/habitat_mapper/model.py",
    "src/habitat_mapper/registry.py",
    "src/habitat_mapper/gui/preview.py",
]
pytest_add_cli_args = ["-p", "no:cacheprovider"]
# accelerators.py isn't mutated, and one of its tests trips over mutmut capturing stderr
pytest_add_cli_args_test_selection = ["--ignore=tests/test_accelerators.py"]
# Needed by tests/test_cli_docs.py
also_copy = ["scripts/", "docs/reference/"]

[tool.uv]
# Only lock package versions that ship wheels for the platforms we test on
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
