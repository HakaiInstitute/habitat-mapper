[project]
name = "habitat-mapper"
version = "0.14.1"
description = "Habitat segmentation with AI"
readme = "README.md"
authors = [{ name = "Taylor Denouden", email = "taylor.denouden@hakai.org" }]
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = [
    "cyclopts>=4.23.0",
    "defusedxml>=0.7.1",
    "deprecation>=2.1.0",
    "humanize>=4.12.3",
    "loguru>=0.7.3",
    "numba>=0.62",
    "numpy>=2.2.6",
    "onnxruntime>=1.24.4 ; platform_system == 'Darwin'",
    "onnxruntime-ep-webgpu>=0.4.0",
    "onnxruntime-gpu>=1.24.4 ; platform_system != 'Darwin'",
    "opencv-python-headless>=4.11.0.86",
    "platformdirs>=4.3.8",
    "pydantic>=2.11.7",
    "rasterio>=1.4.4",
    "requests>=2.32.4",
    "rich>=13.0.0",
    "rioxarray>=0.19.0",
    "xarray>=2025.6.1",
    "xarray-spatial>=0.5.3",
]

[project.optional-dependencies]
# CUDA 13, for NVIDIA driver R580 or newer
cuda = [
    "onnxruntime-gpu[cuda, cudnn]>=1.27.0 ; platform_system != 'Darwin'",
]
# CUDA 12, for older NVIDIA drivers. onnxruntime-gpu 1.26 is the last release built for CUDA 12
cuda12 = [
    "onnxruntime-gpu[cuda, cudnn]>=1.24.4,<1.27.0 ; platform_system != 'Darwin'",
]
# WebGPU is now installed by default. The extra is kept so existing install commands keep working
webgpu = []

[dependency-groups]
conversion = [
    "notebook>=7.4.5",
    "onnxscript>=0.5.4",
    "segmentation-models-pytorch>=0.5.0",
]
dev = [
    "pyrefly>=0.60.0",
    "ipykernel>=7.1.0",
    "dask[array]>=2026.3.0",
    "mypy>=1.17.1",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pyupgrade>=3.20.0",
    "ruff>=0.12.5",
    "types-requests>=2.32.4.20250809",
]
docs = [
    "mkdocstrings-python>=1.19.0",
    "zensical>=0.0.73",
]
examples = [
    "fiona>=1.10.1",
    "jupyter>=1.1.1",
    "polars>=1.33.0",
    "rasterio>=1.4.4",
    "shapely>=2.1.1",
    "tqdm>=4.67.1",
]

[project.urls]
Documentation = "https://habitat-mapper.readthedocs.io"

[project.scripts]
hab = "habitat_mapper.main:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
preview = true

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "Q",
    "S",
    "T",
    "UP",
    "ANN",
    "TC",
    "DOC",
    "D",
    "NPY",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",
    "N999",
    "D",
]
"examples/*" = [
    "T201",
    "ANN",
    "D",
    "S101",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
strict = true

# Third-party libraries without stubs
[[tool.mypy.overrides]]
module = [
    "dask.*",
    "onnxruntime.*",
    "onnxruntime_ep_webgpu.*",
    "rasterio.*"
]
ignore_missing_imports = true

[tool.uv]
# Only lock package versions that ship wheels for the platforms we test on
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# Each extra installs a different onnxruntime-gpu build
conflicts = [[{ extra = "cuda" }, { extra = "cuda12" }]]
